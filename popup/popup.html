<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartNote AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 SmartNote AI</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode">🌙</button>
    </div>

    <div class="input-section">
      <textarea id="inputText" placeholder="Paste text here or select text on any webpage..."></textarea>
      <div class="char-count">
        <span id="charCount">0</span> / 5000 characters
      </div>
    </div>

    <div class="tone-section">
      <label for="toneSelect">Tone (for rephrase):</label>
      <select id="toneSelect">
        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
        <option value="academic">Academic</option>
      </select>
    </div>

    <div class="button-grid">
      <button class="btn btn-primary" id="summarizeBtn">📋 Summarize</button>
      <button class="btn btn-primary" id="proofreadBtn">✏️ Proofread</button>
      <button class="btn btn-primary" id="rephraseBtn">🔄 Rephrase</button>
      <button class="btn btn-primary" id="simplifyBtn">🧠 Simplify</button>
      <button class="btn btn-primary" id="translateBtn">🌍 Translate</button>
    </div>

    <div class="output-section" id="outputSection" style="display: none;">
      <div class="output-header">
        <h3>Result:</h3>
        <button class="btn-small" id="copyBtn" title="Copy result">📋 Copy</button>
      </div>
      <div id="outputText" class="output-text"></div>
      <button class="btn btn-secondary" id="saveBtn">💾 Save to SmartBoard</button>
    </div>

    <div class="loading" id="loadingState" style="display: none;">
      <div class="spinner"></div>
      <p>Processing with AI...</p>
    </div>

    <div class="footer">
      <button class="link-btn" id="dashboardBtn">📊 Open SmartBoard</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
